<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>HGSB Manifesto Paneli</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        /* Sayfanın genel yazı tipi ve arka plan rengi ayarları */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #eef2f7; }
        /* İçerik kutusunun (beyaz alan) boyut, gölge ve kenarlık ayarları */
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        /* Başlık stili: Mavi renk ve alt çizgi */
        h2 { color: rgb(47, 117, 181); border-bottom: 2px solid rgb(47, 117, 181); padding-bottom: 10px; margin-top: 0; }
        /* Veri yapıştırma kutusunun (Textarea) boyut ve yazı tipi ayarları */
        textarea { width: 100%; height: 250px; border: 1px solid #ccc; border-radius: 8px; padding: 12px; font-family: 'Consolas', monospace; box-sizing: border-box; font-size: 14px; margin-bottom: 15px; }
        /* Radyo butonlarının (seçeneklerin) bulunduğu alanın tasarımı */
        .options { margin: 15px 0; display: flex; gap: 20px; font-weight: bold; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        /* Dosya adı giriş alanının hizalaması */
        .filename-area { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        /* Dosya adı input kutusunun tasarımı */
        .filename-area input { flex: 1; padding: 12px; border: 2px solid rgb(47, 117, 181); border-radius: 6px; font-size: 14px; outline: none; }
        /* İndirme butonunun rengi, boyutu ve hover (üzerine gelince) efektleri */
        button { width: 100%; padding: 18px; background: rgb(47, 117, 181); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #235a8c; }
    </style>
</head>
<body>

<div class="container">
    <h2>Yolcu Manifesto Paneli</h2>
    
    <div class="options">
        <label><input type="radio" name="tur" value="tip_1" checked> Slaşlı (SXS,FHY,STW)</label>
        <label><input type="radio" name="tur" value="tip_2"> TK (Boşluklu Grup)</label>
        <label><input type="radio" name="tur" value="tip_3"> iFly (Excel Çıktıdan kopya.)</label>
        <label><input type="radio" name="tur" value="tip_4"> SunExpress GenDec</label>
    </div>

    <textarea id="data" placeholder="Verileri buraya yapıştır..."></textarea>
    
    <div class="filename-area">
        <strong>Dosya Adı:</strong>
        <input type="text" id="fileNameInput" placeholder="HGSB_GUNCEL_LISTE">
    </div>

    <button onclick="excelUret()">Filtrele ve Excel İndir</button>
</div>

<script>
// İsimlerin içindeki unvanları (MR, MRS vb.) ve rakamları temizleyen fonksiyon
function unvanTemizle(val) {
    // Eğer gelen değer boşsa, boş döndür ve çık
    if (!val) return '';
    
    // Gelen değeri önce boşluklardan arındır (trim) ve tamamen büyük harfe çevir
    let d = val.trim().toUpperCase();
    
    // Temizlenecek havacılık unvanlarının listesi
    const uv = ['ASSOC', 'MSTR', 'MISS', 'MRS', 'CHD', 'INF', 'PROF', 'DR', 'MR', 'MS'];
    
    // Listedeki her bir unvan için döngü oluştur
    uv.forEach(u => {
        // Unvanı kelime bütünü olarak (başında/sonunda boşluk veya satır sonu) bulmak için Regex kuralı
        let r = new RegExp('\\b' + u + '\\b|' + u + '$', 'gi');
        // Bulunan unvanı metinden sil (yerine boşluk koymadan)
        d = d.replace(r, '');
    });
    
    // Son olarak metin içinde kalan rakamları sil, çift boşlukları teke indir ve kenar boşluklarını al
    return d.replace(/\d+/g, '').replace(/\s+/g, ' ').trim();
}

// Excel oluşturma işlemini başlatan asenkron ana fonksiyon
async function excelUret() {
    try {
        // Textarea içindeki ham veriyi değişkene al
        const rawData = document.getElementById('data').value;
        // Seçili olan radyo butonunun (format tipinin) değerini al
        const formatTuru = document.querySelector('input[name="tur"]:checked').value;
        // Dosya adı girilmemişse varsayılan olarak "HGSB_Manifesto" ismini ata
        let fileName = document.getElementById('fileNameInput').value.trim() || "HGSB_Manifesto";

        // ExcelJS kütüphanesi ile yeni bir çalışma kitabı (Workbook) oluştur
        const wb = new ExcelJS.Workbook();
        // Çalışma kitabına "Sayfa1" adında yeni bir sayfa ekle
        const ws = wb.addWorksheet('Sayfa1');
        
        // Excel tablosunun başlıklarını tanımla
        const headers = ["Adı", "Soyadı", "Milliyeti (REF)", "Cinsiyet (REF)", "Belge Tipi (REF)", "Belge No", "Koltuk No", "Bagaj Sayısı", "Bagaj Ağırlığı"];
        // Başlıkları ilk satıra ekle
        const headerRow = ws.addRow(headers);

        // Başlık satırındaki her hücreyi döngüyle gez ve stil ver (Mavi arka plan, beyaz yazı)
        headerRow.eachCell(c => {
            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2F75B5' } };
            c.font = { color: { argb: 'FFFFFFFF' }, bold: true };
        });

        // Ham veriyi satır satır bölerek bir diziye (array) dönüştür
        const lines = rawData.split(/\r?\n/);
        
        // Her bir satır için işlem yap
        lines.forEach(line => {
            // Satırın başındaki ve sonundaki boşlukları temizle
            let s = line.trim();
            // Eğer satır boşsa işlem yapma, sonraki satıra geç
            if (!s) return;

            // --- TIP 1: Slaşlı Format (SXS, FHY, STW) Kontrolü ---
            if (formatTuru === "tip_1") {
                // Eğer satır "0" ile başlıyorsa (sayfa numarası vb.), bu satırı atla
                if (s.startsWith("0")) return; 
                
                // Satırı slaş (/) karakterine göre parçalara ayır
                let p = s.split('/');
                
                // Eğer en az 2 parça varsa (Soyad ve Ad kısmı mevcutsa)
                if (p.length >= 2) {
                    // İlk parça soyadıdır, başındaki rakamları temizle
                    let adultSoyad = p[0].replace(/^\d+/, '').trim();
                    // İkinci parça ilk yolcunun adıdır, unvanları temizle
                    let firstAdultAd = unvanTemizle(p[1]);
                    // Temizlenmiş ad varsa Excel'e ekle
                    if (firstAdultAd) ws.addRow([firstAdultAd, adultSoyad]);

                    // Satırın devamındaki diğer parçaları (diğer yolcular veya bebekler) kontrol et
                    for (let i = 2; i < p.length; i++) {
                        let segment = p[i].trim();
                        
                        // Eğer parçada 'INF' (Bebek) ibaresi varsa
                        if (segment.includes('INF')) {
                            // INF kelimesine göre parçayı ikiye böl (Yetişkin adı ve Bebek adı)
                            let parts = segment.split(/\d*INF/);
                            
                            // INF öncesinde bir isim varsa (Yetişkin), temizle ve ekle
                            if (parts[0].trim()) {
                                let yetiskinAd = unvanTemizle(parts[0].trim());
                                if (yetiskinAd) ws.addRow([yetiskinAd, adultSoyad]);
                            }
                            
                            // INF sonrasında bebek adı var mı diye bak (yoksa bir sonraki parçaya bak)
                            let bebekAdRaw = parts[1] ? parts[1].trim() : (p[i + 1] ? p[i + 1].trim() : "");
                            
                            // Bebek adı bulunduysa temizle ve ekle
                            if (bebekAdRaw) {
                                let bebekAd = unvanTemizle(bebekAdRaw);
                                ws.addRow([bebekAd, adultSoyad]);
                                // Eğer bebek adı bir sonraki parçadan alındıysa, döngüyü bir adım ileri al
                                if (!parts[1] && p[i+1]) i++;
                            }
                        } else {
                            // INF yoksa normal bir yolcu ismidir, temizle ve ekle
                            let digerAd = unvanTemizle(segment);
                            if (digerAd) ws.addRow([digerAd, adultSoyad]);
                        }
                    }
                }
            }
            // --- TIP 2: TK (Boşluklu Grup) Format Kontrolü ---
            else if (formatTuru === "tip_2") {
                // Satırı boşluklara göre parçala
                let p = s.split(/\s+/);
                
                // En az 2 parça varsa işlem yap
                if (p.length >= 2) {
                    // İlk parça soyadıdır, baştaki rakamları sil
                    let soyad = p[0].replace(/^\d+/, '').trim();
                    
                    // Geri kalan parçaları ad olarak döngüye al
                    for (let i = 1; i < p.length; i++) {
                        let ad = unvanTemizle(p[i]);
                        // Eğer ad temizlendikten sonra geçerliyse (1 harften uzunsa) ekle
                        if (ad && ad.length > 1) ws.addRow([ad, soyad]);
                    }
                }
            }
            // --- TIP 3: iFly (Excel'den Kopya) Format Kontrolü ---
            else if (formatTuru === "tip_3") {
                // Eğer satır sadece rakamlardan oluşuyorsa (00, 01 gibi sıra nolar), bu satırı atla
                if (/^\d+$/.test(s)) return;

                // Satırı tab (\t) veya çoklu boşluklara (\s{2,}) göre sütunlara ayır
                let parts = s.includes('\t') ? s.split('\t') : s.split(/\s{2,}/); 
                
                // Sütunlar içinde, içinde '/' (slaș) geçen parçayı bul (İsim sütunu budur)
                let namePart = parts.find(p => p.includes('/'));

                // Eğer isim sütunu bulunduysa
                if (namePart) {
                    // İsim parçasını '/' işaretinden böl
                    let nameSplit = namePart.split('/');
                    
                    // En az 2 parça (Ad ve Soyad) varsa işlem yap
                    if (nameSplit.length >= 2) {
                        // İlk kısım soyadıdır
                        let soyad = nameSplit[0].trim();
                        // İkinci kısım addır, unvanTemizle fonksiyonu ile MR/DR temizle
                        let ad = unvanTemizle(nameSplit[1]).trim();
                        
                        // Sadece hem ad hem soyad doluysa Excel'e satır ekle
                        if (ad && soyad) {
                            ws.addRow([ad, soyad]);
                        }
                    }
                }
            }
            // --- TIP 4: SunExpress GenDec Format Kontrolü ---
            else if (formatTuru === "tip_4") {
                const crewRoles = ["CP", "FO", "PU", "JU"];
                let p = s.split(/\s+/);
                // Satır görev kodu ile başlıyorsa (CP, FO, PU, JU)
                if (crewRoles.includes(p[0].toUpperCase())) {
                    // Görev kodu p[0], No p[1], Uyruk p[son]
                    // İsimler p[2]'den sondan bir önceki elemana kadar
                    let nameParts = p.slice(2, -1); 
                    if (nameParts.length >= 2) {
                        let soyad = nameParts.pop().toUpperCase();
                        let ad = nameParts.join(' ');
                        ws.addRow([unvanTemizle(ad), soyad]);
                    }
                }
            }
        });

        // Excel dosyasındaki sütunların genişliklerini ayarla (Görsel düzen)
        ws.columns = [{width: 25}, {width: 25}, {width: 15}, {width: 15}, {width: 15}, {width: 15}, {width: 12}, {width: 12}, {width: 12}];
        
        // Excel dosyasını oluştur (Buffer olarak yaz)
        const buf = await wb.xlsx.writeBuffer();
        
        // Dosyayı indirmek için sanal bir link (a etiketi) oluştur
        const a = document.createElement('a');
        // Oluşturulan buffer'ı bir Blob nesnesine çevir ve linke bağla
        a.href = window.URL.createObjectURL(new Blob([buf]));
        // İndirilecek dosyanın adını belirle
        a.download = fileName + ".xlsx";
        // Linke programatik olarak tıkla (İndirmeyi başlat)
        a.click();
    } catch (err) {
        // Hata olursa konsola yazdır
        console.error("Hata oluştu:", err);
        // Kullanıcıya uyarı ver
        alert("İşlem sırasında bir hata oluştu. Konsolu kontrol edin.");
    }
}
</script>
</body>
</html>
